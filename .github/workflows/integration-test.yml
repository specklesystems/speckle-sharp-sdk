name: Integration Test

on:
  workflow_call:
    inputs:
      docker-compose-file:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true
      BUNDLE_SPEC_TOKEN:
        required: true
jobs:
  integration-test:
    env:
      Solution: "Speckle.Sdk.slnx"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Bundle Spec Repo
        uses: ./.github/actions/checkout-bundle-spec
        with:
          token: ${{ secrets.BUNDLE_SPEC_TOKEN }}

      # actions/checkout cannot write outside $GITHUB_WORKSPACE; the csproj expects the spec one level up.
      - name: Move speckle-bundle-spec to sibling location
        run: mv speckle-bundle-spec "$GITHUB_WORKSPACE/../speckle-bundle-spec"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.4xx #Keep aligned with global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: 🔐 Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: ⚙️ Spin up Server
        run: docker compose --file ${{ inputs.docker-compose-file }} up --wait

      # `up --wait` only reports that a container is unhealthy, never its output, so a
      # dependency that dies on startup is otherwise undiagnosable from the run log.
      - name: 🐛 Dump container state
        if: failure()
        run: |
          docker compose --file "../${{ env.CLIENT_DIR }}/docker-compose.yml" ps -a
          docker compose --file "../${{ env.CLIENT_DIR }}/docker-compose.yml" logs --no-color --tail=200
        working-directory: ${{ env.SERVER_DIR }}

      - name: 📦 Restore
        run: dotnet restore ${{ env.Solution }} --locked-mode

      - name: 🏗️ Build
        run: dotnet build ${{ env.Solution }} --configuration Release --no-restore -warnaserror

      - name: 🔨 Integration Tests
        if: ${{ !inputs.use-internal-image }}
        run: dotnet test ${{ env.Solution }} --configuration Release --no-build --no-restore --verbosity=normal /p:AltCover=true /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          files: tests/**/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
