name: Integration Test

on:
  workflow_call:
    inputs:
      docker-compose-file:
        required: true
        type: string
      use-internal-image:
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: true
      # Fine-grained PAT with Contents:Read on specklesystems/speckle-bundle-spec (private) —
      # needed to check out the sibling spec repo Speckle.Sdk.Parquet compiles from.
      BUNDLE_SPEC_TOKEN:
        required: true
jobs:
  integration-test:
    env:
      Solution: "Speckle.Sdk.slnx"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Speckle.Sdk.Parquet compiles the spec's generated C# from a sibling speckle-bundle-spec
      # checkout one level up ($(MSBuildThisFileDirectory)../../../speckle-bundle-spec).
      - name: Checkout speckle-bundle-spec
        uses: actions/checkout@v7
        with:
          repository: specklesystems/speckle-bundle-spec
          # Pin: speckle-bundle-spec main as of 2026-08-04 (merge of spec PR #12 — BundleCols.cs codegen).
          # Keep aligned with the pin in pr.yml.
          ref: ecbbd270fae06b00ee08e1b1022a08dd3f170c8f
          token: ${{ secrets.BUNDLE_SPEC_TOKEN }}
          path: speckle-bundle-spec
          persist-credentials: false

      # actions/checkout cannot write outside $GITHUB_WORKSPACE; the csproj expects the spec one level up.
      - name: Move speckle-bundle-spec to sibling location
        run: mv speckle-bundle-spec "$GITHUB_WORKSPACE/../speckle-bundle-spec"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx #Keep aligned with global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: 🔐 Login to Github Container Registry
        if: ${{ inputs.use-internal-image }}
        uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: ⚙️ Spin up Server
        run: docker compose --file ${{ inputs.docker-compose-file }} up --wait

      - name: 📦 Restore
        run: dotnet restore ${{ env.Solution }} --locked-mode

      - name: 🏗️ Build
        run: dotnet build ${{ env.Solution }} --configuration Release --no-restore -warnaserror

      - name: 🔨 Integration Tests against Public Server
        if: ${{ !inputs.use-internal-image }}
        run: dotnet test ${{ env.Solution }} --filter "(Category=Integration)&(Server!=Internal)" --configuration Release --no-build --no-restore --verbosity=normal /p:AltCover=true /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage

      - name: 🔨 Integration Tests against Internal Server
        if: ${{ inputs.use-internal-image }}
        run: dotnet test ${{ env.Solution }} --filter "(Category=Integration)&(Server!=Public)" --configuration Release --no-build --no-restore --verbosity=normal /p:AltCover=true /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          files: tests/**/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
