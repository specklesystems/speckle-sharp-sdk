name: Integration Test

on:
  workflow_call:
    inputs:
      speckle-sharp-sdk-ref:
        required: true
        type: string
    secrets:
      # Token with Contents:Read on specklesystems/speckle-bundle-spec (private) — needed to check out
      # the sibling spec repo Speckle.Sdk.Parquet compiles from. The server repo's CONNECTORS_GH_TOKEN
      # (already scoped to speckle-bundle-spec) qualifies.
      BUNDLE_SPEC_TOKEN:
        required: true

jobs:
  integration-test:
    env:
      CLIENT_DIR: "./client"
      CLIENT_REPO: "specklesystems/speckle-sharp-sdk"
      SERVER_DIR: "./server"
      SERVER_REPO: "specklesystems/speckle-server-internal"
      SOLUTION: "Speckle.Sdk.slnx"
      SPECKLE_SERVER_IMAGE: "speckle-server:local"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.CLIENT_REPO }}
        uses: actions/checkout@v7
        with:
          path: ${{ env.CLIENT_DIR }}
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ inputs.speckle-sharp-sdk-ref }}

      - name: Checkout ${{ env.SERVER_REPO }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SERVER_REPO }}
          path: ${{ env.SERVER_DIR }}

      # Speckle.Sdk.Parquet compiles the spec's generated C# from a sibling speckle-bundle-spec checkout
      # one level up from the SDK checkout — with the SDK at ./client that is the workspace root.
      - name: Checkout speckle-bundle-spec
        uses: actions/checkout@v7
        with:
          repository: specklesystems/speckle-bundle-spec
          # Pin: speckle-bundle-spec main as of 2026-08-04 (merge of spec PR #12 — BundleCols.cs codegen).
          # Keep aligned with the pin in pr.yml.
          ref: ecbbd270fae06b00ee08e1b1022a08dd3f170c8f
          token: ${{ secrets.BUNDLE_SPEC_TOKEN }}
          path: speckle-bundle-spec
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx #Keep aligned with global.json
      #          cache: true
      #          cache-dependency-path: "**/packages.lock.json"

      - name: 🏗️ Build Server
        run: docker build --file "./packages/server/Dockerfile" --tag ${{ env.SPECKLE_SERVER_IMAGE }} .
        working-directory: ${{ env.SERVER_DIR }}
          
      - name: ⚙️ Spin up Server
        run: docker compose --file "../${{ env.CLIENT_DIR }}/docker-compose-internal.yml" up --wait
        working-directory: ${{ env.SERVER_DIR }}
        env:
          SPECKLE_SERVER_IMAGE: ${{ env.SPECKLE_SERVER_IMAGE }}

      - name: 📦 Restore .NET Solution
        run: dotnet restore ${{ env.SOLUTION }} --locked-mode
        working-directory: ${{ env.CLIENT_DIR }}
        
      - name: 🏗️ Build .NET Solution
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore -warnaserror
        working-directory: ${{ env.CLIENT_DIR }}
        
      - name: 🔨 Run .NET Integration Tests 
        run: dotnet test ${{ env.SOLUTION }} --filter "(Category=Integration)&(Server!=Public)" --configuration Release --no-build --no-restore --verbosity=normal
        working-directory: ${{ env.CLIENT_DIR }}
