name: "speckle-server"

services:
  ####
  # Speckle Server dependencies
  #######
  postgres:
    image: 'postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7'
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: speckle
    volumes:
      - ./.volumes/postgres-data:/var/lib/postgresql
    command: postgres -c max_prepared_transactions=150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speckle -d speckle"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 20s

  redis:
    image: "valkey/valkey:8.1-alpine@sha256:0d27f0bca0249f61d060029a6aaf2e16b2c417d68d02a508e1dfb763fa2948b4"
    restart: always
    volumes:
      - ./.volumes/redis-data:/data
    # Published for the host-networked bundle-migration worker below.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    image: "dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020"
    command: /garage server --single-node --default-access-key --default-bucket
    restart: always
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "minioadmin"
      GARAGE_DEFAULT_SECRET_KEY: "minioadminminioadmin"
      GARAGE_DEFAULT_BUCKET: "speckle-server"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./.volumes/garage-data:/data
    # Presigned URLs embed S3_PUBLIC_ENDPOINT, consumed by Job pods and the host alike.
    ports:
      - '${KIND_PUBLISH_ADDRESS:?run scripts/integration-cluster.sh up, then export its env}:9000:9000'
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  speckle-server:
    image: ${SPECKLE_SERVER_IMAGE:-ghcr.io/specklesystems/speckle-server:latest}
    restart: always
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "try { require('node:http').request({headers: {'Content-Type': 'application/json'}, port:3000, hostname:'127.0.0.1', path:'/readiness', method: 'GET', timeout: 2000 }, (res) => { body = ''; res.on('data', (chunk) => {body += chunk;}); res.on('end', () => {process.exit(Number(res.statusCode != 200 || body.toLowerCase().includes('error')));}); }).end(); } catch { process.exit(1); }"
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 90s
    ports:
      - "0.0.0.0:3000:3000"
    # Viewer-.dat generation runs as Kubernetes Jobs on the kind cluster of
    # scripts/integration-cluster.sh; its internal kubeconfig addresses the API server by
    # container name on the kind network.
    networks:
      - default
      - kind
    volumes:
      - type: bind
        source: ./.kind/kubeconfig
        target: /kind/kubeconfig
        read_only: true
        bind:
          create_host_path: false
      # A server predating the job system ignores JOB_SYSTEM_KUBECONFIG and runs
      # CONVERTER_IMAGE through the Docker Engine API on this socket instead
      # (CONVERSION_RUNNER_LOCAL_DEV, host network, never pulls: CI pulls on the host).
      # Drop the socket, group_add and CONVERSION_RUNNER_LOCAL_DEV once a
      # speckle-server:latest without that stand-in is published.
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as distroless uid 65532; the socket is root:docker 0660, so the
    # server needs the host's docker group (the CI job passes its gid).
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      CANONICAL_URL: "http://127.0.0.1:3000"
      SPECKLE_AUTOMATE_URL: "http://127.0.0.1:3030"
      FRONTEND_ORIGIN: "http://127.0.0.1:8081"
      BIND_ADDRESS: "0.0.0.0"
      
      # TODO: Change thvolumes:
      REDIS_URL: "redis://redis"

      S3_ENDPOINT: "http://garage:9000"
      S3_PUBLIC_ENDPOINT: "http://${KIND_HOST_ADDRESS:?run scripts/integration-cluster.sh up, then export its env}:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadminminioadmin"
      S3_BUCKET: "speckle-server"
      S3_CREATE_BUCKET: "true"

      FILE_SIZE_LIMIT_MB: 100
      MAX_PROJECT_MODELS_PER_PAGE: 500

      # TODO: Change this to a unique secret for this server
      SESSION_SECRET: "TODO:ReplaceWithLongString"

      STRATEGY_LOCAL: "true"

      POSTGRES_URL: 'postgres://speckle:speckle@postgres:5432/speckle'
      ENABLE_MP: "false"

      LOG_PRETTY: "true"

      FF_DATA_MODULE_ENABLED: 'true'

      FF_JOBRUNNER_ENABLED: 'true'
      CONVERSION_RUNNER_LOCAL_DEV: 'true'
      CONVERTER_IMAGE: ${SPECKLE_CONVERTER_IMAGE:-ghcr.io/specklesystems/speckle-converters:latest}
      JOB_SYSTEM_KUBECONFIG: /kind/kubeconfig
      JOB_SYSTEM_NAMESPACE: conversion
      JOB_SYSTEM_NODE_POOL: conversion
      # scripts/integration-cluster.sh load-image puts the image on the node.
      JOB_SYSTEM_IMAGE_PULL_POLICY: IfNotPresent
      # Job pods reach the server through the host, not over the compose network.
      FILEIMPORT_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: 'true'
      PRIVATE_OBJECTS_SERVER_URL: "http://${KIND_HOST_ADDRESS}:3000"
      # Requests are hard reservations on the one node, which the stack and the test
      # run share; test models are small, and an OOM climbs the x2 memory ladder.
      MODEL_INGESTION_DAT_GENERATION_BASE_MEMORY_MIB: 1024

      # The legacy-send switch (server ADR-0003): unset, versionMutations.create and the
      # v1 uploads/process rail answer LEGACY_SEND_UNSUPPORTED. Any value works, the
      # worker below never sees it (the server mints per-job tokens from it).
      BUNDLE_MIGRATION_TOKEN_SECRET: "integration-tests-bundle-migration-token-secret"

  # Since server ADR-0003 a legacy send only reserves a version; this worker packs the
  # bundle (+ viewer .dat) and completes it, which is when the version is born. It runs
  # on the host network because the server hands it its own CANONICAL_URL and presigned
  # S3_PUBLIC_ENDPOINT urls, both host addresses from the runner's point of view.
  bundle-migration-service:
    image: ${SPECKLE_BUNDLE_MIGRATION_IMAGE:-ghcr.io/specklesystems/speckle-bundle-migration-service:latest}
    restart: always
    network_mode: host
    depends_on:
      speckle-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({ port: 3031, hostname: '127.0.0.1', path: '/readiness', timeout: 2000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 30s
    environment:
      HOST: "127.0.0.1"
      PORT: 3031
      REDIS_URL: "redis://127.0.0.1:6379"
      BUNDLE_MIGRATION_LANE: "standard"
      # Fixed DuckDB memory limit for datgen: unset sizes from the cgroup, which is
      # unbounded in a plain docker container.
      DATGEN_MEM: "2GB"
      LOG_PRETTY: "true"

networks:
  default:
    name: speckle-server
  kind:
    external: true

volumes:
  postgres-data:
  redis-data:
  garage-data:
