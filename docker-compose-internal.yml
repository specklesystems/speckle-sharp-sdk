name: "speckle-server"

services:
  ####
  # Speckle Server dependencies
  #######
  postgres:
    image: 'postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7'
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: speckle
    volumes:
      - ./.volumes/postgres-data:/var/lib/postgresql
    command: postgres -c max_prepared_transactions=150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speckle -d speckle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: "valkey/valkey:8.1-alpine@sha256:0d27f0bca0249f61d060029a6aaf2e16b2c417d68d02a508e1dfb763fa2948b4"
    restart: always
    volumes:
      - ./.volumes/redis-data:/data
    # Published for the host-networked bundle-migration worker below.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    command: server /data --console-address ":9001"
    restart: always
    volumes:
      - ./.volumes/minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null http://127.0.0.1:9000/minio/index.html",
        ]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s

  speckle-server:
    image: ${SPECKLE_SERVER_IMAGE:-ghcr.io/specklesystems/speckle-server:latest}
    restart: always
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "try { require('node:http').request({headers: {'Content-Type': 'application/json'}, port:3000, hostname:'127.0.0.1', path:'/readiness', method: 'GET', timeout: 2000 }, (res) => { body = ''; res.on('data', (chunk) => {body += chunk;}); res.on('end', () => {process.exit(Number(res.statusCode != 200 || body.toLowerCase().includes('error')));}); }).end(); } catch { process.exit(1); }"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CANONICAL_URL: "http://127.0.0.1:3000"
      SPECKLE_AUTOMATE_URL: "http://127.0.0.1:3030"
      FRONTEND_ORIGIN: "http://127.0.0.1:8081"
      BIND_ADDRESS: "0.0.0.0"
      
      # TODO: Change thvolumes:
      REDIS_URL: "redis://redis"

      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://127.0.0.1:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "speckle-server"
      S3_CREATE_BUCKET: "true"

      FILE_SIZE_LIMIT_MB: 100
      MAX_PROJECT_MODELS_PER_PAGE: 500

      # TODO: Change this to a unique secret for this server
      SESSION_SECRET: "TODO:ReplaceWithLongString"

      STRATEGY_LOCAL: "true"

      POSTGRES_URL: 'postgres://speckle:speckle@postgres:5432/speckle'
      ENABLE_MP: "false"

      LOG_PRETTY: "true"

      FF_DATA_MODULE_ENABLED: 'true'

      # The legacy-send switch (server ADR-0003): unset, versionMutations.create and the
      # v1 uploads/process rail answer LEGACY_SEND_UNSUPPORTED. Any value works, the
      # worker below never sees it (the server mints per-job tokens from it).
      BUNDLE_MIGRATION_TOKEN_SECRET: "integration-tests-bundle-migration-token-secret"

  # Since server ADR-0003 a legacy send only reserves a version; this worker packs the
  # bundle (+ viewer .dat) and completes it, which is when the version is born. It runs
  # on the host network because the server hands it its own CANONICAL_URL and presigned
  # S3_PUBLIC_ENDPOINT urls, both 127.0.0.1 from the runner's point of view.
  bundle-migration-service:
    image: ${SPECKLE_BUNDLE_MIGRATION_IMAGE:-ghcr.io/specklesystems/speckle-bundle-migration-service:latest}
    restart: always
    network_mode: host
    depends_on:
      speckle-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({ port: 3031, hostname: '127.0.0.1', path: '/readiness', timeout: 2000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    environment:
      HOST: "127.0.0.1"
      PORT: 3031
      REDIS_URL: "redis://127.0.0.1:6379"
      BUNDLE_MIGRATION_LANE: "standard"
      # Fixed DuckDB memory limit for datgen: unset sizes from the cgroup, which is
      # unbounded in a plain docker container.
      DATGEN_MEM: "2GB"
      LOG_PRETTY: "true"

networks:
  default:
    name: speckle-server

volumes:
  postgres-data:
  redis-data:
  minio-data:
